<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<meta name="theme-color" content="#221F18" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>To-Do's Jason</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FBF1BE'/%3E%3Cpath d='M18 33l9 9 19-21' stroke='%235C6B2E' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:light dark;
    --paper:#FBF1BE;
    --ink:#2A2718;
    --ink-soft:#6B6545;
    --rule:#CBB46A;
    --check:#5C6B2E;
    --warn:#8A3E22;
    --press:rgba(42,39,24,.08);
    --l2:#C9AE5F; --l3:#A2B177; --l4:#CBA07C; --l5:#AFAE90; --l6:#B59BB0;
    --field:rgba(255,255,255,.55);
    --bar:#2A2718;
    --bar-ink:#F7EFC9;
    --bar-act:#D9E08A;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#221F18;
      --ink:#F3EBCB;
      --ink-soft:#ABA488;
      --rule:#4A4434;
      --check:#B9C97E;
      --warn:#E8A183;
      --press:rgba(243,235,203,.1);
      --l2:#5E5539; --l3:#4E5C3C; --l4:#614C3C; --l5:#4C4C3E; --l6:#554457;
      --field:rgba(255,255,255,.07);
      --bar:#3A352A;
      --bar-ink:#F3EBCB;
      --bar-act:#C9D88E;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper)}
  body{
    color:var(--ink);
    font-family:Roboto,-apple-system,"Segoe UI",system-ui,sans-serif;
    font-size:17px;
    line-height:1.4;
    padding:0 0 calc(104px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
    overflow-wrap:anywhere;
  }
  button,input{touch-action:manipulation}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  #app{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .row{min-width:290px}

  header{padding:26px 0 12px;position:sticky;top:0;background:var(--paper);z-index:5}
  h1{margin:0;font-size:30px;font-weight:500;letter-spacing:-.015em}
  .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:6px;min-height:22px}
  .count{font-size:14px;color:var(--ink-soft)}
  .clear:active{opacity:.6}
  .clear{
    background:none;border:0;padding:2px 0;font:inherit;font-size:14px;
    color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;
  }
  .clear[hidden]{display:none}

  .notice{
    margin:0 0 14px;padding:12px 14px;border-left:3px solid var(--warn);
    background:rgba(138,62,34,.07);color:var(--warn);font-size:15px;border-radius:0 6px 6px 0;
  }
  .notice[hidden]{display:none}
  .notice button{
    display:block;margin-top:6px;border:0;background:none;padding:0;font:inherit;
    color:var(--warn);text-decoration:underline;text-underline-offset:3px;cursor:pointer;
  }

  ul{list-style:none;margin:0;padding:0}
  .kids{margin-left:8px;padding-left:12px;border-left:2px solid var(--rule)}
  .kids.tight{margin-left:2px;padding-left:8px}
  .kids.lvl2,.kids.lvl7 {border-color:var(--l2)}
  .kids.lvl3,.kids.lvl8 {border-color:var(--l3)}
  .kids.lvl4,.kids.lvl9 {border-color:var(--l4)}
  .kids.lvl5,.kids.lvl10{border-color:var(--l5)}
  .kids.lvl6,.kids.lvl11{border-color:var(--l6)}

  .row{display:flex;align-items:flex-start;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
  .row.flip{transition:none}

  .fold{
    flex:0 0 auto;width:30px;height:48px;border:0;background:none;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:8px;
    color:var(--ink-soft);font-size:13px;line-height:1;
  }
  .fold:active{background:var(--press)}
  .fold span{transition:transform .15s}
  .fold.shut span{transform:rotate(-90deg)}
  .fold.none{visibility:hidden}

  .badge{
    flex:0 0 auto;align-self:center;margin-right:2px;
    font-size:13px;color:var(--ink-soft);background:var(--press);
    border-radius:10px;padding:2px 8px;
  }

  .box{
    flex:0 0 auto;width:46px;height:48px;border:0;background:none;padding:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;
  }
  .box:active{background:var(--press)}
  .box span{
    width:21px;height:21px;border:2px solid var(--ink-soft);border-radius:6px;
    display:block;position:relative;transition:border-color .15s,background-color .15s;
  }
  .box span::after{
    content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;
    border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(42deg) scale(.4);
    opacity:0;transition:opacity .12s,transform .12s;
  }
  .done > .box span{background:var(--check);border-color:var(--check)}
  .done > .box span::after{opacity:1;transform:rotate(42deg) scale(1)}

  .text{
    flex:1 1 auto;min-width:0;padding:13px 6px;border:0;background:none;font:inherit;
    color:inherit;text-align:left;cursor:text;border-radius:8px;
  }
  .text:active{background:var(--press)}
  .row:not(.depth1) > .text{font-size:16px}
  .deep > .box,.deep > .sub{width:38px}
  .deep > .fold{width:26px}
  .deep > .text{padding-left:2px;padding-right:2px}
  .done > .text{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1px}

  .sub{
    flex:0 0 auto;width:46px;height:48px;border:0;background:none;padding:0;cursor:pointer;
    color:var(--check);font-size:24px;line-height:1;border-radius:10px;
  }
  .sub:active{background:var(--press)}

  .edit{display:flex;align-items:center;gap:6px;padding:4px 0 4px 30px}
  .kids .edit{padding-left:0}
  .edit.open{flex-direction:column;align-items:stretch;gap:2px}
  .edit-acts{display:flex;align-items:center;gap:2px}
  .edit-acts .spacer{flex:1 1 auto}
  .move{
    border:0;background:none;font:inherit;font-size:20px;line-height:1;
    width:48px;height:44px;border-radius:8px;color:var(--ink-soft);cursor:pointer;
  }
  .move:active{background:var(--press)}
  .move[disabled]{opacity:.3}
  input[type=text]{
    flex:1 1 auto;min-width:0;font:inherit;color:var(--ink);
    background:var(--field);border:0;border-bottom:2px solid var(--check);
    border-radius:4px 4px 0 0;padding:8px 10px;outline:none;
  }
  .btn{
    flex:0 0 auto;border:0;background:none;font:inherit;font-size:15px;padding:10px 6px;
    color:var(--check);cursor:pointer;
  }
  .btn:active{background:var(--press);border-radius:8px}
  .btn.danger{color:var(--warn);margin-left:10px}

  .add{
    display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
    font:inherit;color:var(--ink-soft);padding:15px 0 15px 10px;cursor:pointer;text-align:left;
    border-radius:8px;
  }
  .add:active{background:var(--press)}
  .add .plus{font-size:20px;line-height:1}

  .empty{padding:36px 8px;color:var(--ink-soft);border-top:1px solid var(--rule)}
  .empty p{margin:0 0 6px}

  .fab{
    position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:60px;height:60px;border:0;border-radius:20px;z-index:25;
    background:var(--check);color:var(--paper);font-size:32px;line-height:1;
    box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;
  }
  .fab:active{transform:scale(.94)}
  .undo{
    position:fixed;left:14px;right:88px;
    bottom:calc(22px + env(safe-area-inset-bottom));
    z-index:20;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-radius:10px;
    background:var(--bar);color:var(--bar-ink);font-size:15px;
    box-shadow:0 6px 20px rgba(42,39,24,.28);
  }
  .undo[hidden]{display:none}
  .undo span{flex:1 1 auto}
  .undo button{
    flex:0 0 auto;border:0;background:none;font:inherit;color:var(--bar-act);padding:6px 4px;cursor:pointer;
  }

  .vaultkop{
    display:flex;align-items:center;gap:10px;margin:22px 0 4px;padding-top:14px;
    border-top:1px dashed var(--rule);color:var(--ink-soft);font-size:14px;
  }
  .vaultkop .slot{font-size:15px}
  .vaultkop .titel{flex:1 1 auto}
  .vaultkop button{
    border:0;background:none;font:inherit;font-size:14px;color:var(--ink-soft);
    text-decoration:underline;text-underline-offset:3px;padding:4px 2px;cursor:pointer;
  }
  .vaultkop .drop{text-decoration:none}

  .movebar{
    position:sticky;top:78px;z-index:6;display:flex;align-items:center;gap:10px;
    margin:0 0 10px;padding:10px 12px;border-radius:10px;
    background:var(--bar);color:var(--bar-ink);font-size:15px;
  }
  .movebar[hidden]{display:none}
  .movebar .wat{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .movebar button{
    flex:0 0 auto;border:0;background:none;font:inherit;font-size:15px;
    color:var(--bar-act);padding:6px 4px;cursor:pointer;
  }
  .drop{
    flex:0 0 auto;width:46px;height:48px;border:0;padding:0;cursor:pointer;border-radius:10px;
    background:var(--press);color:var(--check);font-size:20px;line-height:1;
  }
  .drop:active{opacity:.6}
  .deep > .drop{width:38px}

  .gate{max-width:420px;margin:40px auto;padding:0 6px;color:var(--ink)}
  .gate h2{margin:0 0 10px;font-size:20px;font-weight:500}
  .gate p{margin:0 0 18px;color:var(--ink-soft);font-size:15px}
  .gate .rij{display:flex;gap:6px;align-items:center}
  .gate .melding{margin-top:12px;color:var(--warn);font-size:15px;min-height:20px}

  .sheet{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(42,39,24,.42);
  }
  .sheet[hidden]{display:none}
  .sheet-card{
    width:100%;max-width:420px;background:var(--paper);border-radius:14px;
    padding:22px 20px 12px;box-shadow:0 12px 32px rgba(0,0,0,.32);
  }
  .sheet-card p{margin:0 0 18px;font-size:17px}
  .sheet-acts{display:flex;justify-content:flex-end;gap:4px}
  .sheet-acts button{
    border:0;background:none;font:inherit;font-size:16px;padding:12px 14px;
    border-radius:8px;color:var(--ink-soft);cursor:pointer;
  }
  .sheet-acts button.primary{color:var(--warn);font-weight:500}

  button:focus-visible,input:focus-visible{outline:2px solid var(--check);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.row{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-act="tap">To-Do&#39;s Jason</h1>
    <div class="meta">
      <span class="count" id="count"></span>
      <span class="count" id="sync"></span>
      <button type="button" class="clear" id="clear" data-act="askClear" hidden>Afgevinkte taken verwijderen</button>
    </div>
  </header>
  <p class="notice" id="notice" hidden></p>
  <div class="movebar" id="movebar" hidden>
    <span class="wat" id="moveWat"></span>
    <button type="button" data-act="dropRoot">Hoofdlijst</button>
    <button type="button" data-act="cancelMove">Stop</button>
  </div>
  <div class="gate" id="gate" hidden>
    <h2>Deze lijst is afgeschermd</h2>
    <p>Open de persoonlijke link die je hebt gekregen, dan gaat de lijst vanzelf open.
       Heb je die niet bij de hand, plak dan hieronder de sleutel.</p>
    <div class="rij">
      <input type="text" id="gateKey" placeholder="sleutel" autocomplete="off" enterkeyhint="go">
      <button type="button" class="btn" data-act="unlock">Openen</button>
    </div>
    <p class="melding" id="gateMsg"></p>
  </div>
  <main id="app"></main>
</div>
<button type="button" class="fab" id="fab" data-act="addroot" aria-label="Taak toevoegen">+</button>
<div class="sheet" id="pin" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="pinText">
    <p id="pinText"></p>
    <input type="password" id="pinKey" inputmode="numeric" autocomplete="off"
           placeholder="pincode" enterkeyhint="go">
    <p class="melding" id="pinMsg" style="margin:10px 0 0;color:var(--warn);font-size:14px;min-height:18px"></p>
    <div class="sheet-acts">
      <button type="button" data-act="pinCancel">Annuleren</button>
      <button type="button" class="primary" data-act="pinOk" style="color:var(--check)">Openen</button>
    </div>
  </div>
</div>
<div class="sheet" id="confirm" hidden>
  <div class="sheet-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
    <p id="confirmText"></p>
    <div class="sheet-acts">
      <button type="button" data-act="cancelClear" id="confirmNo">Annuleren</button>
      <button type="button" class="primary" data-act="doClear">Verwijderen</button>
    </div>
  </div>
</div>
<div class="undo" id="undo" hidden>
  <span id="undoText"></span>
  <button type="button" data-act="undo">Ongedaan maken</button>
</div>

<script>
(function(){
  "use strict";

  /* ================== INSTELLINGEN ==================
     Vul deze drie regels in om de lijst ook in Supabase te bewaren.
     Laat ze leeg en de app werkt precies zoals hiervoor, alleen op de telefoon. */
  var CLOUD = {
    url:  "https://xtlwrppyuexpvzgykoli.supabase.co",
    key:  "sb_publishable_6pRc7BsZ0pexcVwx51WvwQ__YVx5SHw",
    list: ""    // komt uit de persoonlijke link, staat bewust niet in dit bestand
  };
  /* ================================================== */

  var KEY       = "todo-jason-v1";
  var STAMP     = "todo-jason-stamp";
  var LISTKEY   = "todo-jason-sleutel";
  var BACKUP    = "todo-jason-backup";
  var MAX_DEPTH = 10;    // tien lagen diep, daaronder stopt het
  var MAX_TEXT  = 500;

  var items = [];
  var edit  = null;      // {id} bestaande taak aanpassen
  var add   = null;      // {parent: null | id} nieuwe taak
  var mem   = null;      // vangnet als de browser niets mag opslaan
  var undoState = null;
  var undoTimer = null;
  var stamp     = 0;       // wanneer de lijst voor het laatst is gewijzigd
  var pending   = false;   // nog niet naar Supabase gestuurd
  var pushTimer = null;
  var moving    = null;   // taak die op zoek is naar een nieuwe plek
  var vaultItems = [];    // geheime lijst, alleen in het geheugen als hij open is
  var vaultBlob  = null;  // versleutelde vorm zoals hij wordt opgeslagen
  var vaultKey   = null;  // afgeleide sleutel, verdwijnt bij vergrendelen
  var vaultOpen  = false;
  var taps = 0, tapTimer = null;
  var encRonde = 0;

  /* ---------- hulpjes die nooit mogen omvallen ---------- */
  function safe(fn, fallback){
    try{ return fn(); }catch(e){ return fallback; }
  }
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function notice(msg, action){
    var el = document.getElementById("notice");
    if(!el) return;
    el.innerHTML = esc(msg) + (action ? '<button type="button" data-act="'+action.act+'">'+esc(action.label)+'</button>' : "");
    el.hidden = false;
  }

  /* ---------- alles wat binnenkomt kan rommel zijn ---------- */
  function clean(list, depth, seen){
    var out = [];
    if(!Array.isArray(list)) return out;
    list.forEach(function(raw){
      if(!raw || typeof raw !== "object") return;                  // null, tekst, getal
      var text = typeof raw.text === "string" ? raw.text.slice(0, MAX_TEXT).trim() : "";
      if(!text) return;                                            // taak zonder tekst
      var id = (typeof raw.id === "string" && raw.id && !seen[raw.id]) ? raw.id : uid();
      seen[id] = true;
      var kids = clean(raw.children, depth + 1, seen);
      var node = {id:id, text:text, done: raw.done === true, collapsed: raw.collapsed === true, children: []};
      out.push(node);
      if(depth < MAX_DEPTH) node.children = kids;
      else if(kids.length) out.push.apply(out, kids);              // te diep: zelfde niveau
    });
    return out;
  }

  /* ---------- opslag ---------- */
  function storageWorks(){
    return safe(function(){
      localStorage.setItem("__test__", "1");
      localStorage.removeItem("__test__");
      return true;
    }, false);
  }

  function load(){
    if(!storageWorks()){
      items = mem || [];
      notice("Deze browser mag niets opslaan, dus de lijst verdwijnt als je hem sluit. Zet het blokkeren van site-gegevens uit voor deze pagina.");
      return;
    }
    var raw = safe(function(){ return localStorage.getItem(KEY); }, null);
    var parsed = null;
    if(raw){
      parsed = safe(function(){ return JSON.parse(raw); }, null);
      if(parsed === null){
        safe(function(){ localStorage.setItem("todo-jason-kapot", raw); });     // bewaren, niet weggooien
        var back = safe(function(){ return JSON.parse(localStorage.getItem(BACKUP)); }, null);
        parsed = back;
        notice(back ? "De lijst was beschadigd. De laatst bewaarde versie staat er weer."
                    : "De lijst kon niet gelezen worden en is opnieuw begonnen.");
      }
    }
    unpack(parsed);
    stamp = safe(function(){ return parseInt(localStorage.getItem(STAMP), 10) || 0; }, 0);
  }

  // oude opslag was een kale lijst, nieuwe heeft ook een geheim deel
  function unpack(raw){
    if(Array.isArray(raw)){ items = clean(raw, 1, {}); vaultBlob = null; return; }
    if(raw && typeof raw === "object"){
      items = clean(raw.items, 1, {});
      vaultBlob = (raw.vault && typeof raw.vault === "object") ? raw.vault : null;
      return;
    }
    items = []; vaultBlob = null;
  }
  function pack(){
    return {v:2, items: items, vault: vaultBlob};
  }

  function save(push){
    mem = items;
    writeNow(push);
    if(vaultOpen && vaultKey){
      var mijn = ++encRonde;
      encryptVault().then(function(blob){
        if(mijn !== encRonde) return;          // een nieuwere versie is al onderweg
        vaultBlob = blob;
        writeNow(push);
      }).catch(function(){});
    }
  }

  function writeNow(push){
    var text = safe(function(){ return JSON.stringify(pack()); }, null);
    if(text === null) return;
    if(push !== false) stamp = Date.now();
    var ok = safe(function(){
      var prev = localStorage.getItem(KEY);
      if(prev) localStorage.setItem(BACKUP, prev);     // vorige goede versie achter de hand
      localStorage.setItem(KEY, text);
      localStorage.setItem(STAMP, String(stamp));
      return true;
    }, false);
    if(!ok) notice("De lijst kon niet opgeslagen worden. Maak ruimte vrij op de telefoon en probeer het opnieuw.");
    if(push !== false) queuePush();
  }

  /* ---------- geheime lijst: versleutelen met een pincode ---------- */
  function subtle(){
    return safe(function(){ return window.crypto.subtle ? window.crypto : null; }, null);
  }
  function b64(buf){
    var bytes = new Uint8Array(buf), bin = "";
    for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function unb64(str){
    var bin = atob(str), out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function deriveKey(pin, salt){
    var c = subtle();
    return c.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return c.subtle.deriveKey(
          {name:"PBKDF2", salt: salt, iterations: 150000, hash:"SHA-256"},
          base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
      });
  }
  function encryptVault(){
    var c = subtle();
    if(!c || !vaultKey) return Promise.reject(new Error("geen sleutel"));
    var iv = c.getRandomValues(new Uint8Array(12));
    var data = new TextEncoder().encode(JSON.stringify(vaultItems));
    return c.subtle.encrypt({name:"AES-GCM", iv: iv}, vaultKey, data).then(function(buf){
      return {s: vaultBlob && vaultBlob.s ? vaultBlob.s : null, i: b64(iv), c: b64(buf)};
    });
  }

  /* ---------- zoeken en sorteren ---------- */
  function seek(list, id, depth){
    for(var i = 0; i < list.length; i++){
      if(list[i].id === id) return {list:list, index:i, item:list[i], depth:depth};
      var hit = seek(list[i].children, id, depth + 1);
      if(hit) return hit;
    }
    return null;
  }
  function find(id, list, depth){
    if(list) return seek(list, id, depth || 1);
    return seek(items, id, 1) || (vaultOpen ? seek(vaultItems, id, 1) : null);
  }
  function each(list, fn){
    list.forEach(function(it){ fn(it); each(it.children, fn); });
  }
  function reposition(list, index){
    var it = list.splice(index, 1)[0];
    if(it.done){ list.push(it); return; }
    var pos = 0;
    while(pos < list.length && !list[pos].done) pos++;
    list.splice(pos, 0, it);
  }
  // buurman met dezelfde status zoeken: open taken blijven boven, afgevinkte onder
  function neighbour(id, dir){
    var f = find(id);
    if(!f) return null;
    for(var i = f.index + dir; i >= 0 && i < f.list.length; i += dir){
      if(f.list[i].done === f.item.done) return {f:f, target:i};
      break;
    }
    return null;
  }
  function canMove(id, dir){ return !!neighbour(id, dir); }
  function move(id, dir){
    var n = neighbour(id, dir);
    if(!n) return;
    var l = n.f.list, a = n.f.index, b = n.target;
    var tmp = l[a]; l[a] = l[b]; l[b] = tmp;
    save();
    render();
  }

  // hoe hoog is de tak die we verplaatsen, en zit een doel er zelf in?
  function height(it){
    var h = 1;
    it.children.forEach(function(k){ h = Math.max(h, 1 + height(k)); });
    return h;
  }
  function inside(node, id){
    var hit = false;
    each(node.children, function(k){ if(k.id === id) hit = true; });
    return hit;
  }
  function canDrop(targetId, targetDepth){
    if(!moving) return false;
    var src = find(moving);
    if(!src) return false;
    if(targetId === moving || inside(src.item, targetId)) return false;   // niet in zichzelf
    var f = find(targetId);
    if(f && f.item.children.indexOf(src.item) > -1) return false;         // staat er al in
    return targetDepth + height(src.item) <= MAX_DEPTH;
  }
  function canDropRoot(){
    var src = moving ? find(moving) : null;
    return !!src && height(src.item) <= MAX_DEPTH;
  }
  function drop(targetId, naarVault){
    var src = find(moving);
    if(!src){ moving = null; render(); return; }
    if(naarVault){
      rememberFor("Taak verplaatst");
      insertOpen(vaultItems, src.list.splice(src.index, 1)[0]);
      moving = null; save(); render(); return;
    }
    dropInto(targetId, src);
  }
  function dropInto(targetId, src){
    var doel = targetId ? find(targetId) : null;
    if(targetId && !doel){ moving = null; render(); return; }
    rememberFor("Taak verplaatst");
    var node = src.list.splice(src.index, 1)[0];
    if(doel){
      doel.item.collapsed = false;
      insertOpen(doel.item.children, node);
    }else{
      insertOpen(items, node);
    }
    moving = null;
    save();
    render();
  }

  function insertOpen(list, node){
    var pos = 0;
    while(pos < list.length && !list[pos].done) pos++;
    list.splice(pos, 0, node);
  }

  /* ---------- tekenen ---------- */
  function editorHTML(value, label){
    return '<input type="text" id="editor" maxlength="'+MAX_TEXT+'" value="'+esc(value || "")+'"'
         + ' placeholder="'+esc(label)+'" enterkeyhint="done" autocapitalize="sentences"'
         + ' autocomplete="off">';
  }

  function openCount(it){
    var n = 0;
    each(it.children, function(k){ if(!k.done) n++; });
    return n;
  }

  function rowHTML(it, depth){
    var canNest  = depth < MAX_DEPTH;
    var hasKids  = it.children.length > 0;
    var opening  = add && add.parent === it.id;
    var shut     = it.collapsed === true && hasKids && !opening;
    var h = '<li class="node" data-id="'+esc(it.id)+'">';

    if(edit && edit.id === it.id){
      h += '<div class="edit open">' + editorHTML(it.text, "")
         +   '<div class="edit-acts">'
         +     '<button type="button" class="move" data-act="up" aria-label="Omhoog"'
         +       (canMove(it.id, -1) ? "" : " disabled") + '>&#8593;</button>'
         +     '<button type="button" class="move" data-act="down" aria-label="Omlaag"'
         +       (canMove(it.id, 1) ? "" : " disabled") + '>&#8595;</button>'
         +     '<span class="spacer"></span>'
         +     '<button type="button" class="btn" data-act="cut">Verplaatsen</button>'
         +     '<button type="button" class="btn" data-act="save">Opslaan</button>'
         +     '<button type="button" class="btn danger" data-act="del">Wissen</button>'
         +   '</div>'
         + '</div>';
    }else{
      var hidden = shut ? openCount(it) : 0;
      h += '<div class="row depth'+depth+(depth > 3 ? " deep" : "")+(it.done ? " done" : "")+'" data-row="'+esc(it.id)+'">'
         +   '<button type="button" class="fold'+(hasKids ? (shut ? " shut" : "") : " none")+'"'
         +     ' data-act="fold" aria-label="'+(shut ? "Subtaken tonen" : "Subtaken verbergen")+'"'
         +     (hasKids ? "" : " tabindex=\"-1\"") + '><span>&#9660;</span></button>'
         +   '<button type="button" class="box" data-act="toggle" aria-label="Afvinken"><span></span></button>'
         +   '<button type="button" class="text" data-act="edit">'+esc(it.text)+'</button>'
         +   (shut ? '<span class="badge" aria-label="'+hidden+' openstaande subtaken">'+hidden+'</span>' : "")
         +   (moving
               ? (canDrop(it.id, depth) ? '<button type="button" class="drop" data-act="drop" aria-label="Hierin plaatsen">&#8627;</button>' : "")
               : (canNest ? '<button type="button" class="sub" data-act="addchild" aria-label="Subtaak toevoegen">+</button>' : ""))
         + '</div>';
    }

    if(canNest && !shut && (hasKids || opening)){
      var lvl = depth + 1;
      h += '<ul class="kids lvl'+lvl+(lvl >= 5 ? " tight" : "")+'">';
      it.children.forEach(function(k){ h += rowHTML(k, depth + 1); });
      if(opening){
        h += '<li class="edit">' + editorHTML("", "Subtaak")
           + '<button type="button" class="btn" data-act="saveNew">Toevoegen</button></li>';
      }
      h += '</ul>';
    }
    return h + '</li>';
  }

  function draw(){
    var done = 0, total = 0;
    each(items, function(it){ total++; if(it.done) done++; });
    if(vaultOpen) each(vaultItems, function(it){ total++; if(it.done) done++; });

    var h = '<ul>';
    items.forEach(function(it){ h += rowHTML(it, 1); });
    h += '</ul>';

    if(!items.length && !(add && add.parent === null) && !vaultOpen){
      h += '<div class="empty"><p>Je lijst is leeg.</p><p>Tik op <strong>Taak toevoegen</strong> om te beginnen.</p></div>';
    }
    if(add && add.parent === null){
      h += '<div class="edit">' + editorHTML("", "Nieuwe taak")
         + '<button type="button" class="btn" data-act="saveNew">Toevoegen</button></div>';
    }else{
      h += '<button type="button" class="add" data-act="addroot"><span class="plus">+</span>Taak toevoegen</button>';
    }

    if(vaultOpen){
      h += '<div class="vaultkop">'
         +   '<span class="slot">&#128274;</span>'
         +   '<span class="titel">Geheime lijst</span>'
         +   (moving && canDropRoot() ? '<button type="button" class="drop" data-act="dropVault" aria-label="Hierheen verplaatsen">&#8627;</button>' : "")
         +   '<button type="button" data-act="lock">Vergrendelen</button>'
         + '</div>';
      h += '<ul>';
      vaultItems.forEach(function(it){ h += rowHTML(it, 1); });
      h += '</ul>';
      if(add && add.parent === "__vault__"){
        h += '<div class="edit">' + editorHTML("", "Geheime taak")
           + '<button type="button" class="btn" data-act="saveNew">Toevoegen</button></div>';
      }else{
        h += '<button type="button" class="add" data-act="addvault"><span class="plus">+</span>Geheime taak toevoegen</button>';
      }
    }

    document.getElementById("app").innerHTML = h;
    document.getElementById("count").textContent = total ? done + " van " + total + " klaar" : "";
    document.getElementById("clear").hidden = done === 0;

    var bar = document.getElementById("movebar");
    if(bar){
      bar.hidden = !moving;
      if(moving){
        var m = find(moving);
        document.getElementById("moveWat").textContent = m ? "Kies de nieuwe plek voor: " + m.item.text : "";
      }
    }

    var ed = document.getElementById("editor");
    if(ed){
      safe(function(){ ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); });
      safe(function(){ ed.scrollIntoView({block:"center", behavior:"smooth"}); });
    }
  }

  // loopt tekenen stuk, dan blijft de lijst staan en krijgt Jason een knop
  function render(){
    try{ draw(); }
    catch(e){ notice("Er ging iets mis bij het tonen van de lijst.", {act:"reload", label:"Opnieuw laden"}); }
  }

  function reducedMotion(){
    return safe(function(){ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }, false);
  }

  // opnieuw tekenen met een schuifbeweging, zodat je ziet waar een taak heen gaat
  function renderMoving(change){
    var before = {};
    safe(function(){
      document.querySelectorAll("[data-row]").forEach(function(el){
        before[el.getAttribute("data-row")] = el.getBoundingClientRect().top;
      });
    });
    change();
    save();
    render();
    if(reducedMotion()) return;
    safe(function(){
      document.querySelectorAll("[data-row]").forEach(function(el){
        var was = before[el.getAttribute("data-row")];
        if(was === undefined) return;
        var delta = was - el.getBoundingClientRect().top;
        if(!delta) return;
        el.classList.add("flip");
        el.style.transform = "translateY(" + delta + "px)";
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            el.classList.remove("flip");
            el.style.transform = "";
          });
        });
      });
    });
  }

  /* ---------- ongedaan maken ---------- */
  function rememberFor(label){
    var snap = safe(function(){ return JSON.stringify({a: items, b: vaultItems}); }, null);
    if(snap === null) return;
    undoState = {data:snap};
    var t = document.getElementById("undoText");
    if(t) t.textContent = label;
    var bar = document.getElementById("undo");
    if(bar) bar.hidden = false;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideUndo, 8000);
  }
  function hideUndo(){
    undoState = null;
    clearTimeout(undoTimer);
    var bar = document.getElementById("undo");
    if(bar) bar.hidden = true;
  }
  function doUndo(){
    if(!undoState) return;
    var back = safe(function(){ return JSON.parse(undoState.data); }, null);
    if(back){
      items = clean(back.a, 1, {});
      if(vaultOpen) vaultItems = clean(back.b, 1, {});
    }
    hideUndo();
    save();
    render();
  }

  /* ---------- de verborgen lade ---------- */
  function askPin(){
    var c = subtle();
    if(!c){ notice("Deze browser kan geen geheime lijst beveiligen."); return; }
    document.getElementById("pinText").textContent = vaultBlob
      ? "Voer je pincode in om de geheime lijst te openen."
      : "Kies een pincode voor je geheime lijst. Vergeet hem niet: zonder pincode is de inhoud niet meer te openen.";
    document.getElementById("pinMsg").textContent = "";
    document.getElementById("pinKey").value = "";
    document.getElementById("pin").hidden = false;
    document.body.style.overflow = "hidden";
    safe(function(){ document.getElementById("pinKey").focus(); });
  }
  function closePin(){
    var el = document.getElementById("pin");
    if(el) el.hidden = true;
    document.body.style.overflow = "";
  }
  function openVault(){
    var c = subtle();
    var pin = String(document.getElementById("pinKey").value || "");
    if(pin.length < 4){ document.getElementById("pinMsg").textContent = "Minimaal vier tekens."; return; }
    document.getElementById("pinMsg").textContent = "Even geduld...";

    if(!vaultBlob){                                        // eerste keer: lade aanmaken
      var salt = c.getRandomValues(new Uint8Array(16));
      deriveKey(pin, salt).then(function(k){
        vaultKey = k; vaultItems = []; vaultOpen = true;
        vaultBlob = {s: b64(salt), i: null, c: null};
        closePin(); save(); render();
      }).catch(function(){ document.getElementById("pinMsg").textContent = "Dat lukte niet."; });
      return;
    }
    deriveKey(pin, unb64(vaultBlob.s)).then(function(k){
      if(!vaultBlob.c){                                     // lade bestaat maar is nog leeg
        vaultKey = k; vaultItems = []; vaultOpen = true;
        closePin(); render(); return;
      }
      return c.subtle.decrypt({name:"AES-GCM", iv: unb64(vaultBlob.i)}, k, unb64(vaultBlob.c))
        .then(function(buf){
          var lijst = JSON.parse(new TextDecoder().decode(buf));
          vaultKey = k; vaultItems = clean(lijst, 1, {}); vaultOpen = true;
          closePin(); render();
        });
    }).catch(function(){
      document.getElementById("pinMsg").textContent = "Die pincode klopt niet.";
    });
  }
  function lockVault(){
    if(!vaultOpen) return;
    vaultOpen = false; vaultItems = []; vaultKey = null;
    if(moving && !find(moving)) moving = null;
    render();
  }
  function tapTitle(){
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){ taps = 0; }, 1500);
    if(taps >= 3){ taps = 0; if(vaultOpen) lockVault(); else askPin(); }
  }

  /* ---------- bewerken ---------- */
  function commitEdit(){
    var ed = document.getElementById("editor");
    if(!ed) return;
    var val = String(ed.value || "").slice(0, MAX_TEXT).trim();

    if(edit){
      var f = find(edit.id);
      if(f && val) f.item.text = val;
      edit = null;
    }else if(add){
      if(val){
        var node = {id:uid(), text:val, done:false, children:[]};
        if(add.parent === null){
          insertOpen(items, node);
        }else if(add.parent === "__vault__"){
          insertOpen(vaultItems, node);
        }else{
          var p = find(add.parent);
          if(p && p.depth < MAX_DEPTH) insertOpen(p.item.children, node);
          else add = null;
        }
      }else{
        add = null;
      }
    }
    save();
    render();
  }

  /* ---------- klikken ---------- */
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "confirm"){ closeConfirm(); return; }   // naast het venster getikt
    if(e.target && e.target.id === "pin"){ closePin(); return; }
    var btn = safe(function(){ return e.target.closest("[data-act]"); }, null);
    if(!btn){
      if(document.getElementById("editor") && !safe(function(){ return e.target.closest(".edit"); }, null)) commitEdit();
      return;
    }
    var act = btn.getAttribute("data-act");
    var li  = safe(function(){ return btn.closest(".node"); }, null);
    var id  = li ? li.getAttribute("data-id") : null;
    var f;

    if(act === "undo"){ doUndo(); return; }
    if(act === "askClear"){ commitEdit(); askClear(); return; }
    if(act === "cancelClear"){ closeConfirm(); return; }
    if(act === "doClear"){ closeConfirm(); clearDone(); return; }
    if(act === "reload"){ safe(function(){ location.reload(); }); return; }

    if(act === "toggle"){
      renderMoving(function(){
        var hit = find(id);
        if(!hit) return;
        hit.item.done = !hit.item.done;
        each(hit.item.children, function(k){ k.done = hit.item.done; });   // subtaken gaan mee
        reposition(hit.list, hit.index);
      });
      return;
    }
    if(act === "cut"){
      commitEdit();
      moving = id; edit = null; add = null;
      render();
      return;
    }
    if(act === "cancelMove"){ moving = null; render(); return; }
    if(act === "tap"){ tapTitle(); return; }
    if(act === "lock"){ commitEdit(); lockVault(); return; }
    if(act === "pinCancel"){ closePin(); return; }
    if(act === "pinOk"){ openVault(); return; }
    if(act === "dropVault"){ drop(null, true); return; }
    if(act === "addvault"){ commitEdit(); add = {parent:"__vault__"}; edit = null; render(); return; }
    if(act === "drop"){ drop(id); return; }
    if(act === "dropRoot"){ drop(null); return; }
    if(act === "fold"){
      commitEdit();                       // openstaande invoer eerst afronden
      f = find(id);
      if(f && f.item.children.length){
        if(!f.item.collapsed && add && add.parent === id) add = null;
        f.item.collapsed = !f.item.collapsed;
        save();
        render();
      }
      return;
    }
    if(act === "edit"){ commitEdit(); edit = {id:id}; add = null; render(); return; }
    if(act === "up" || act === "down"){
      var ed = document.getElementById("editor");
      if(ed && edit){                                   // getypte wijziging niet kwijtraken
        var v = String(ed.value || "").slice(0, MAX_TEXT).trim();
        var cur = find(edit.id);
        if(cur && v) cur.item.text = v;
      }
      move(id, act === "up" ? -1 : 1);
      return;
    }
    if(act === "save" || act === "saveNew"){ commitEdit(); return; }
    if(act === "del"){
      f = find(id);
      if(f){
        rememberFor(f.item.children.length ? "Taak met subtaken gewist" : "Taak gewist");
        f.list.splice(f.index, 1);
      }
      edit = null; save(); render(); return;
    }
    if(act === "addchild"){
      commitEdit();
      f = find(id);
      if(f) f.item.collapsed = false;
      add = {parent:id}; edit = null; render(); return;
    }
    if(act === "addroot"){ commitEdit(); add = {parent:null}; edit = null; render(); return; }
  });

  document.addEventListener("keydown", function(e){
    var pinSheet = document.getElementById("pin");
    if(pinSheet && !pinSheet.hidden){
      if(e.key === "Escape"){ e.preventDefault(); closePin(); }
      if(e.key === "Enter" && e.target && e.target.id === "pinKey"){ e.preventDefault(); openVault(); }
      return;
    }
    var sheet = document.getElementById("confirm");
    if(sheet && !sheet.hidden){
      if(e.key === "Escape"){ e.preventDefault(); closeConfirm(); }
      return;
    }
    if(!e.target || e.target.id !== "editor") return;
    if(e.key === "Enter"){ e.preventDefault(); commitEdit(); }
    if(e.key === "Escape"){ edit = null; add = null; render(); }
  });

  function countDone(){
    var n = 0;
    each(items, function(it){ if(it.done) n++; });
    if(vaultOpen) each(vaultItems, function(it){ if(it.done) n++; });
    return n;
  }
  function askClear(){
    var n = countDone();
    if(!n) return;
    var el = document.getElementById("confirmText");
    if(!el){ clearDone(); return; }                 // venster ontbreekt: dan maar zonder vraag
    el.textContent = n === 1
      ? "Deze afgevinkte taak verwijderen? Subtaken die eronder staan gaan mee."
      : n + " afgevinkte taken verwijderen? Subtaken die eronder staan gaan mee.";
    document.getElementById("confirm").hidden = false;
    document.body.style.overflow = "hidden";
    safe(function(){ document.getElementById("confirmNo").focus(); });
  }
  function closeConfirm(){
    var el = document.getElementById("confirm");
    if(el) el.hidden = true;
    document.body.style.overflow = "";
  }
  function clearDone(){
    if(!countDone()) return;
    rememberFor("Afgevinkte taken verwijderd");
    (function strip(list){
      for(var i = list.length - 1; i >= 0; i--){
        if(list[i].done) list.splice(i, 1);
        else strip(list[i].children);
      }
      return strip;
    })(items);
    if(vaultOpen){
      (function strip(list){
        for(var i = list.length - 1; i >= 0; i--){
          if(list[i].done) list.splice(i, 1);
          else strip(list[i].children);
        }
      })(vaultItems);
    }
    save();
    render();
  }

  /* ---------- niets kwijtraken als de app naar de achtergrond gaat ---------- */
  function stash(){
    closeConfirm();
    closePin();
    if(document.getElementById("editor")) commitEdit();
    else save();
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden"){ stash(); if(pending) push(true); lockVault(); }
    else pull();
  });
  window.addEventListener("online", function(){ if(pending) push(); else pull(); });
  window.addEventListener("pagehide", stash);

  // tweede venster open: overnemen in plaats van overschrijven
  window.addEventListener("storage", function(e){
    if(e.key !== KEY || document.getElementById("editor")) return;
    var next = safe(function(){ return JSON.parse(e.newValue); }, null);
    if(!next) return;
    lockVault();                 // het geheime deel komt in versleutelde vorm binnen
    unpack(next);
    render();
  });

  // laatste vangnet: liever een knop dan een wit scherm
  window.addEventListener("error", function(){
    notice("Er ging iets mis. Je lijst is bewaard.", {act:"reload", label:"Opnieuw laden"});
  });

  /* ---------- kopie in Supabase ---------- */
  function cloudOn(){
    return !!(CLOUD.url && CLOUD.key && CLOUD.list && typeof fetch === "function");
  }
  function syncStatus(){
    var el = document.getElementById("sync");
    if(el) el.textContent = (cloudOn() && pending) ? "nog niet opgeslagen in de cloud" : "";
  }
  function rpc(name, body, keepalive){
    return fetch(CLOUD.url.replace(/\/+$/, "") + "/rest/v1/rpc/" + name, {
      method: "POST",
      keepalive: !!keepalive,
      headers: {
        "Content-Type": "application/json",
        "apikey": CLOUD.key,
        "Authorization": "Bearer " + CLOUD.key
      },
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok) throw new Error("status " + res.status);
      return res.json();
    });
  }
  function pull(){
    if(!cloudOn()) return;
    safe(function(){
      rpc("get_list", {p_key: CLOUD.list}).then(function(rows){
        var row = Array.isArray(rows) ? rows[0] : rows;
        var when = row && row.updated_at ? Date.parse(row.updated_at) : 0;
        if(row && when > stamp){
          lockVault();
          unpack(row.data);                    // de cloud is nieuwer
          stamp = when;
          save(false);
          render();
          pending = false;
          syncStatus();
        }else if(pending || !row || when < stamp){
          push();                               // deze telefoon is nieuwer
        }
      }).catch(function(){ syncStatus(); });
    });
  }
  function push(keepalive){
    if(!cloudOn()) return;
    safe(function(){
      rpc("save_list", {
        p_key: CLOUD.list,
        p_data: pack(),            // gewone lijst plus het versleutelde geheime deel
        p_updated: new Date(stamp || Date.now()).toISOString()
      }, keepalive).then(function(){
        pending = false;
        syncStatus();
      }).catch(function(){
        pending = true;
        syncStatus();
      });
    });
  }
  function queuePush(){
    if(!cloudOn()) return;
    pending = true;
    syncStatus();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ push(); }, 1200);   // even wachten, niet bij elke tik sturen
  }

  /* ---------- opslag beschermen en offline werken ---------- */
  safe(function(){ navigator.storage.persist(); });
  safe(function(){
    if(!("serviceWorker" in navigator)) return;
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(function(reg){
        // bij elk openen kijken of er een nieuwere versie klaarstaat
        document.addEventListener("visibilitychange", function(){
          if(document.visibilityState === "visible") safe(function(){ reg.update(); });
        });
      }).catch(function(){});
    });
  });

  /* ---------- wie geen sleutel heeft, ziet geen lijst ---------- */
  function keyFromUrl(){
    var m = /[#?&]k=([A-Za-z0-9._~-]{8,120})/.exec(String(location.hash) + String(location.search));
    return m ? m[1] : null;
  }
  function rememberKey(k){
    safe(function(){ localStorage.setItem(LISTKEY, k); });
  }
  function storedKey(){
    return safe(function(){ return localStorage.getItem(LISTKEY) || ""; }, "");
  }
  function showGate(msg){
    document.getElementById("gate").hidden = false;
    document.getElementById("app").hidden = true;
    var fab = document.getElementById("fab");
    if(fab) fab.hidden = true;
    if(msg) document.getElementById("gateMsg").textContent = msg;
    safe(function(){ document.getElementById("gateKey").focus(); });
  }
  function startApp(){
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    var fab = document.getElementById("fab");
    if(fab) fab.hidden = false;
    load();
    render();
    syncStatus();
    pull();
  }
  // een ingevoerde sleutel eerst controleren, zodat een typefout geen lege lijst oplevert
  function unlock(){
    var el = document.getElementById("gateKey");
    var k = el ? String(el.value || "").trim() : "";
    if(k.length < 8){ showGate("Vul de volledige sleutel in."); return; }
    document.getElementById("gateMsg").textContent = "Even controleren...";
    var was = CLOUD.list;
    CLOUD.list = k;
    safe(function(){
      rpc("get_list", {p_key: k}).then(function(rows){
        var row = Array.isArray(rows) ? rows[0] : rows;
        if(row){ rememberKey(k); startApp(); }
        else { CLOUD.list = was; showGate("Deze sleutel hoort niet bij een lijst."); }
      }).catch(function(){
        CLOUD.list = was;
        showGate("Kan nu niet controleren. Check je verbinding en probeer opnieuw.");
      });
    });
  }
  document.addEventListener("click", function(e){
    var b = safe(function(){ return e.target.closest('[data-act="unlock"]'); }, null);
    if(b) unlock();
  });
  document.addEventListener("keydown", function(e){
    if(!e.target) return;
    if(e.target.id === "gateKey" && e.key === "Enter"){ e.preventDefault(); unlock(); }
    if(e.target.id === "pinKey" && e.key === "Enter"){ e.preventDefault(); openVault(); }
  });

  (function begin(){
    if(!CLOUD.url || !CLOUD.key){ startApp(); return; }   // zonder cloud gewoon lokaal werken
    var fromUrl = keyFromUrl();
    if(fromUrl){
      rememberKey(fromUrl);
      safe(function(){                                    // sleutel uit de adresbalk halen
        history.replaceState(null, "", location.pathname);
      });
    }
    CLOUD.list = storedKey();
    if(CLOUD.list) startApp();
    else showGate("");
  })();
})();
</script>
</body>
</html>
