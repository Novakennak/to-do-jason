# Houdt het Supabase-project wakker. Gratis projecten gaan op pauze na een week
# zonder voldoende databaseactiviteit. Deze workflow doet elke dag een echte
# lees- en schrijfactie op de database.
name: Supabase wakker houden

on:
  schedule:
    - cron: "17 6 * * *"      # elke dag, 's ochtends
  workflow_dispatch:           # en met een knop in het tabblad Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database aanspreken
        env:
          URL: "https://xtlwrppyuexpvzgykoli.supabase.co"
          KEY: "sb_publishable_6pRc7BsZ0pexcVwx51WvwQ__YVx5SHw"
        run: |
          set -u
          fout=0

          # 1. echte leesactie via de eigen functie
          lees=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$URL/rest/v1/rpc/get_list" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_key":"wakker-houden"}')
          echo "Leesactie    : $lees"
          [ "$lees" = "200" ] || fout=1

          # 2. echte schrijfactie op een eigen regel, los van de lijst van Jason
          nu=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          schrijf=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$URL/rest/v1/rpc/save_list" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_key\":\"wakker-houden\",\"p_data\":[],\"p_updated\":\"$nu\"}")
          echo "Schrijfactie : $schrijf"
          [ "$schrijf" = "200" ] || fout=1

          if [ "$fout" != "0" ]; then
            echo "Niet alles gaf 200. Project mogelijk gepauzeerd of sleutel gewijzigd."
            exit 1
          fi
          echo "Database is aangesproken."
